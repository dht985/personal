name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  comp-radar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v

  career-weekly:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r career-weekly/requirements.txt
      - name: Run tests
        working-directory: career-weekly
        run: python -m unittest discover -s tests -v
