# 价值评估权重。三个维度分别计分、分别留证，不允许用单一维度直接下结论。

[catalog_score]
# 学校认定本科生学科竞赛目录（当前 2026 版）类别 -> 分数
"一类" = 25
"二类" = 22
"三类" = 17
"四类" = 10
"未收录" = 0

[organizer_score]
# 主办方层级 -> 分数（依据通知原文中"主办单位"等字段判断）
"国家级" = 10
"学会级" = 8
"省级" = 6
"企业级" = 4
"校级" = 2
"未知" = 0

[cs_fit_score]
"核心" = 15
"相关" = 8
"弱" = 1

[timeliness_score]
"报名开放" = 8
"30天内截止" = 6
"90天内截止" = 4
"未找到日期" = 0
"已截止" = 0

[acceptance_score]
# 综合测评赋分维度：分三档，避免"知道有这么回事"被当成"知道加几分"
"赛事级赋分已核实" = 8
"校级规则已核实" = 4
"未核实" = 0

[history_score]
# 历年组织情况：依据校内历年通知，有据可查地说明赛事是否持续举办
"两年及以上" = 4
"仅一年" = 2
"无历史记录" = 0

[campus_support]
# 只统计云南大学/信息学院等校内官方证据，不能再用认定目录冒充活动热度。
max = 15
awareness_1 = 2
awareness_2 = 3
awareness_3plus = 5
mentor_catalog_contact = 1
mentor_activity = 3
mentor_named = 5
awards_1year = 2
awards_2years = 4
awards_3years = 5

[difficulty_score]
max = 6
entry = 3
medium = 6
high = 5
very_high = 4
unknown = 0

[preparation_time_score]
max = 5
# 报名确认后到最早比赛日的可用窗口；只表示时间余量，不冒充实际备赛工作量。
days_60plus = 5
days_30_59 = 4
days_14_29 = 3
days_7_13 = 2
days_under_7 = 1
unknown = 0

[award_ratio_score]
max = 4
percent_30plus = 4
percent_20_29 = 3
percent_10_19 = 2
percent_5_9 = 1
percent_under_5 = 0
unknown = 0

[tier_rules]
# 分层规则。满分 100 = 基础价值 70 + 云大落地 15 + 难度 6 + 备赛窗口 5 + 获奖比例 4。
# 拿到计科综测细则后，综测维度对每个赛事都稳定给 10 分，是全体上移，
# 所以门槛同步 +5，保持分层比例不变。
focus_min_score = 80
# 学校认定为"一类/二类"的赛事直接进入重点关注（前提是适配度合格）
focus_categories = ["一类", "二类"]
# 目录优势不能完全绕过其它证据；一类/二类仍需达到最低综合分。
focus_catalog_min_score = 65
# 临近截止 + 计算机核心赛道 + 分数达标，也进入重点关注（可立即行动）
focus_actionable_min_score = 50
focus_min_dimensions = 2
potential_min_score = 50
# 适配度为"弱"的赛事不可能进入重点关注
focus_requires_cs_fit = ["核心", "相关"]

[thresholds]
deadline_soon_days = 30
deadline_near_days = 90
