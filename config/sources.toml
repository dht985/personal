# 采集源清单。authority 表示来源可信度：official=官方渠道，org=主办方/学会，aggregator=聚合站。

[[source]]
id = "ynu_bksy"
name = "云南大学本科生院（教务处）"
authority = "official"
scope = "ynu"
parser = "boda_list"
note = "学校学科竞赛主管单位，竞赛通知主发布口"
list_urls = [
  "https://jwc.ynu.edu.cn/sjjxk.htm",
  "https://jwc.ynu.edu.cn/index.htm",
  "https://jwc.ynu.edu.cn/zysw/xkjs_.htm",
]
# 实践教学科栏目分页形如 sjjxk/43.htm，页码越小越旧
pagination = { discover = "sjjxk/(\\d+)\\.htm", url_template = "https://jwc.ynu.edu.cn/sjjxk/{page}.htm", max_pages = 8 }
item_regex = "/info/\\d+/\\d+\\.htm"

