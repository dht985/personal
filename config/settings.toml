[app]
name = "计算机赛事雷达"
timezone = "Asia/Shanghai"

[paths]
data = "data"
raw = "data/raw"
outbox = "outbox"
catalog = "data/catalog_ynu_2026.json"
# 上一版目录：用于判断"2025 目录有、2026 目录没有"的竞赛（细则规定按降一级处理）
catalog_prev = "data/catalog_ynu_2025.json"
candidates = "data/candidates.json"
db = "data/radar.db"
szcp = "data/szcp_ynu.json"
szcp_college = "data/szcp_college.json"

[http]
user_agent = "CompRadarYNU/0.1 (undergraduate competition radar; personal research use)"
timeout_seconds = 25
min_host_interval_seconds = 1.2
max_retries = 3
cache_ttl_hours = 6
save_raw = true

[run]
# only consider notices published within this window
lookback_days = 400
# max detail pages fetched per run (keeps a run short and polite)
detail_limit = 70
# max result pages per search engine
search_pages = 2

[notify]
# 渠道：toast（Windows 桌面通知，零配置）| file（只写文件）
#       wecom（企业微信机器人）| serverchan（Server酱）| email（SMTP）
enabled = true
channel = "toast"
# 干跑：内容只渲染不发送。toast 渠道已实测可用，故关闭干跑。
dry_run = false
# 单条提醒最多带几条赛事，超出部分只提示去看文件
max_items = 10

[notify.toast]
# 点通知打开哪个页面；留空则自动指向 outbox/dashboard.html
launch_path = ""

[notify.wecom]
# 企业微信机器人 Webhook 地址放在环境变量里，不写进配置文件
webhook_env = "COMPRADAR_WECOM_WEBHOOK"

[notify.serverchan]
key_env = "COMPRADAR_SERVERCHAN_KEY"

[notify.email]
host = ""
port = 465
use_ssl = true
username_env = "COMPRADAR_SMTP_USER"
password_env = "COMPRADAR_SMTP_PASS"
from_addr = ""
to_addrs = []

[llm]
# optional fallback extractor; disabled by default so that no key is required
enabled = false
provider = ""
model = ""

[reputation]
# 云大生态评估：知名度 / 导师资源 / 获奖先例
enabled = true
# 同一赛事的云大评估结果缓存多少天再重查（每周跑一次，但不必每周重搜）
refresh_days = 30
# 单轮最多对多少个赛事做定向检索，防止首轮跑太久
max_competitions = 14
# 每个赛事最多保留多少条检索结果
max_results = 12

[search]
# 检索入口：serpapi（结构化 API，稳定）| public（爬公开引擎，会跳验证码）
provider = "serpapi"
# SerpApi 的引擎。中文高校内容用百度索引覆盖最好
engine = "baidu"
key_env = "COMPRADAR_SERPAPI_KEY"
num_results = 10
cache_hours = 6
# 单轮最多消耗多少次真实 API 调用（免费档 50 次/小时，留余量）
max_calls_per_run = 45
